name: Browser compatibility smoke tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the browser run it left going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Decides whether the browser tests need to run for this change. A job
    # skipped by its `if` reports success, so required checks never hang.
    name: Detect browser-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify the changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SKIP_IF: '^(docs/.*|.*\.md|LICENSE|infra/.*|compose\.yaml|\.dockerignore|\.env\.example|\.github/workflows/ci\.yml)$'
        run: |
          browser=true
          changed=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git fetch -q --depth=1 origin "$BEFORE"; then changed=$(git diff --name-only "$BEFORE" HEAD); fi
          fi
          if [ -n "$changed" ]; then
            if [ -n "${RUN_IF:-}" ]; then
              echo "$changed" | grep -qE "$RUN_IF" || browser=false
            else
              echo "$changed" | grep -qvE "$SKIP_IF" || browser=false
            fi
          fi
          echo "Changed files:"
          echo "$changed"
          echo "browser=$browser" | tee -a "$GITHUB_OUTPUT"

  compatibility:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Firefox on Linux
            os: ubuntu-24.04
            browser: firefox
          - label: Chromium with emulated Android
            os: ubuntu-24.04
            browser: chromium
          - label: WebKit desktop and emulated iPhone on macOS
            os: macos-15
            browser: webkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build browser app
        run: pnpm build
      - name: Install the browser engine
        env:
          COMPAT_BROWSER: ${{ matrix.browser }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm exec playwright install --with-deps "$COMPAT_BROWSER"
          else
            pnpm exec playwright install "$COMPAT_BROWSER"
          fi
      - name: Run compatibility smoke tests
        env:
          CI: "true"
          COMPAT_BROWSER: ${{ matrix.browser }}
        run: pnpm exec playwright test -c playwright.compat.config.ts
      - name: Upload Playwright report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-compat-${{ matrix.browser }}
          path: |
            playwright-report/compat/
            test-results/compat/
          if-no-files-found: warn
          retention-days: 7
