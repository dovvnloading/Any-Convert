name: Windows Chrome WebM to MP4 regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the browser run it left going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Decides whether the browser tests need to run for this change. A job
    # skipped by its `if` reports success, so required checks never hang.
    name: Detect browser-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify the changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SKIP_IF: '^(docs/.*|.*\.md|LICENSE|infra/.*|compose\.yaml|\.dockerignore|\.env\.example|\.github/workflows/ci\.yml)$'
        run: |
          browser=true
          changed=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git fetch -q --depth=1 origin "$BEFORE"; then changed=$(git diff --name-only "$BEFORE" HEAD); fi
          fi
          if [ -n "$changed" ]; then
            if [ -n "${RUN_IF:-}" ]; then
              echo "$changed" | grep -qE "$RUN_IF" || browser=false
            else
              echo "$changed" | grep -qvE "$SKIP_IF" || browser=false
            fi
          fi
          echo "Changed files:"
          echo "$changed"
          echo "browser=$browser" | tee -a "$GITHUB_OUTPUT"

  windows-webm-mp4:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: FFmpeg and FFprobe
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -hide_banner -version | Select-Object -First 1
          ffprobe -hide_banner -version | Select-Object -First 1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm build
      - name: Generate real media fixtures
        run: python tools/media/generate_fixtures.py
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Convert VP9 Opus WebM into verified H264 AAC MP4
        env:
          CI: "true"
        run: pnpm exec playwright test --grep "VP9.*WebM"
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-webm-mp4-playwright-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
