name: Verify Any-Convert

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Types, lint, tests, build and real media fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg
        timeout-minutes: 6
        run: |
          # Package mirrors occasionally stall: cap network waits and retry
          # transient download failures rather than consuming the 40m job.
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=25
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=25 ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build web
        env:
          NEXT_PUBLIC_ENABLE_NATIVE: "true"
          NATIVE_INTERNAL_URL: "http://127.0.0.1:4300"
        run: pnpm build
      - name: Generate test media
        run: python3 tools/media/generate_fixtures.py
      - name: Native API, isolation and FFmpeg integration
        run: pnpm test:native
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build self-hosted Docker images
        run: docker compose --env-file .env.example build
      - name: Smoke test self-hosted Caddy gateway
        run: |
          docker compose --env-file .env.example up -d --no-build
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/api/native/health > /tmp/any-convert-health.json; then
              break
            fi
            sleep 2
          done
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const health = JSON.parse(readFileSync("/tmp/any-convert-health.json", "utf8"));
            if (health.engine !== "native-ffmpeg" || !health.formats.includes("gif")) process.exit(1);
          '
          ready=0
          for i in $(seq 1 40); do
            if curl --fail --silent --output /tmp/any-convert-page.html http://127.0.0.1:8080/native; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "The web route did not become ready behind Caddy"
            docker compose --env-file .env.example ps
            docker compose --env-file .env.example logs --tail=120 web edge native
            exit 1
          fi
          grep -q "Built to be" /tmp/any-convert-page.html
      - name: Stop self-hosted containers
        if: always()
        run: docker compose --env-file .env.example down --remove-orphans
      - name: Start native service for browser tests
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p "$RUNNER_TEMP/any-convert-native"
          HOST=127.0.0.1 PORT=4300 PUBLIC_ORIGIN=http://127.0.0.1:3000 MEDIA_DIR="$RUNNER_TEMP/any-convert-native" nohup node apps/native-service/src/server.mjs > "$RUNNER_TEMP/any-convert-native.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/any-convert-native.pid"
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4300/api/native/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "Native service failed to start"
          cat "$RUNNER_TEMP/any-convert-native.log"
          exit 1
      - name: Install Chromium for browser integration tests
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec playwright install --with-deps chromium
      - name: Real conversion browser journey
        if: github.event_name == 'workflow_dispatch'
        run: pnpm test:browser
      - name: Real FFmpeg fixture and native-worker integration
        env:
          ANY_CONVERT_REQUIRE_WORKER: "1"
        run: pnpm test:media
      - name: Stop browser-test native service
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          if [ -f "$RUNNER_TEMP/any-convert-native.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/any-convert-native.pid")" || true
          fi
      - name: Dependency audit
        run: pnpm audit --audit-level high
