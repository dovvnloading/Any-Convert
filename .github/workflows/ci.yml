name: Verify Any-Convert

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Types, lint, tests, build and real media fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      # M0 temporary: frozen lockfile to be created after first connected install.
      - name: Install dependencies (temporary non-frozen)
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build web
        run: pnpm build
      - name: Real FFmpeg fixture and native-worker integration
        env:
          ANY_CONVERT_REQUIRE_WORKER: "1"
        run: pnpm test:media
      - name: Dependency audit
        run: pnpm audit --audit-level high
