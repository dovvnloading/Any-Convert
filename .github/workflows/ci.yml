name: Verify Any-Convert

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Types, lint, tests, build and real media fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build web
        run: pnpm build
      - name: Generate test media
        run: python3 tools/media/generate_fixtures.py
      - name: Install Chromium for browser integration tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Real conversion browser journey
        run: pnpm test:browser
      - name: Real FFmpeg fixture and native-worker integration
        env:
          ANY_CONVERT_REQUIRE_WORKER: "1"
        run: pnpm test:media
      - name: Dependency audit
        run: pnpm audit --audit-level high
